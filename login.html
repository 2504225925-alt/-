<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智慧养老平台登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-body">
    <div class="login-page">
      <div class="login-panel">
        <div class="login-brand">
          <div class="brand-mark">智</div>
          <div>
            <div class="brand-name">智慧养老</div>
            <div class="brand-sub">平台管理中心</div>
          </div>
        </div>

        <div class="login-copy">
          <div class="eyebrow">智能服务管理系统</div>
          <h1>让健康照护更高效、更安全</h1>
          <p>连接老人档案、健康数据、设备状态与服务工单的全场景管理平台。</p>
        </div>
      </div>

      <div class="login-card">
        <div class="login-header">
          <h2>欢迎登录</h2>
          <span>账号中心</span>
        </div>

        <form class="login-form">
          <label class="field">
            <span>用户名</span>
            <input type="text" value="admin" />
          </label>

          <label class="field">
            <span>密码</span>
            <input type="password" value="123456" />
          </label>

          <div class="login-meta">
            <label class="remember-me"><input type="checkbox" checked /> 记住我</label>
            <a href="#">忘记密码？</a>
          </div>

          <button type="submit" class="primary-btn login-btn">登录系统</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
